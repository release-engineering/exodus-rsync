name: Go

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    # Required for OIDC: https://github.com/codecov/codecov-action?tab=readme-ov-file#using-oidc
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v2
      with:
        # we don't want a shallow clone because we want to use "git describe"
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.26

    - name: Run all checks
      run: make all

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        flags: unit-tests
        files: coverage.out
        fail_ci_if_error: false
